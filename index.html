<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>오조록의 제주 맛집 목록</title>
  <meta name="description" content="책 읽기 좋은 민박, 오조록에서 손님을 위해 직접 고른 제주 맛집 목록입니다. 내돈내산, 광고 아님." />

  <!-- ★ 도메인을 바꾸면 아래 두 줄(og:url, og:image)을 반드시 함께 고치세요 ★
       ─────────────────────────────────────────────────────────────
       카톡/LINE 공유 미리보기용입니다.
       카톡 같은 앱은 자바스크립트를 실행하지 않고 이 글자만 그대로 읽어갑니다.
       그래서 설정 파일에서 자동으로 채울 수 없고, 여기에 전체 주소를 직접 적어야 합니다.
       (상대 주소 `/images/og.png` 는 못 읽습니다. 반드시 https:// 부터)

       og:image 뒤의 ?v=2 는 그림을 바꿨다고 알리는 표시입니다.
       카톡은 같은 주소면 예전 그림을 계속 씁니다. 캐시를 지워도 그렇습니다.
       그림을 새로 만들 때마다 이 숫자를 하나씩 올리세요. -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://ojorokmustvisitlist.vercel.app/" />
  <meta property="og:title" content="오조록의 제주 맛집 목록" />
  <meta property="og:description" content="오조록 주인장이 손님을 위해 직접 고른 제주 맛집 목록 — 내돈내산, 광고 아님" />
  <meta property="og:image" content="https://ojorokmustvisitlist.vercel.app/images/og.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="오조록 · 제주 맛집 37곳" />

  <!-- 트위터/X 는 별도 태그를 봅니다. 없으면 미리보기가 작게 뜹니다. -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta property="og:locale" content="ko_KR" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:locale:alternate" content="zh_TW" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>" />

  <!-- 글꼴: Pretendard — 바꾸려면 이 줄과 styles/tokens.css 의 --font-sans 를 함께 교체 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

  <!-- 지도 CSS 는 OpenStreetMap(Leaflet) 을 쓸 때만 필요합니다.
       네이버 지도를 쓰면 아래 script 가 알아서 걷어냅니다. -->
  <link rel="stylesheet" id="leaflet-css" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- 디자인 시스템 — 순서가 곧 우선순위입니다. 바꾸지 마세요. -->
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/layout.css" />
</head>
<body>

  <header class="app-header">
    <a class="app-header__brand" href="./" data-i18n="brand">오조록</a>
    <div class="app-header__actions">
      <div class="segmented" id="lang-toggle" role="tablist" aria-label="Language">
        <button type="button" class="segmented__item" role="tab" data-lang="ko">KR</button>
        <button type="button" class="segmented__item" role="tab" data-lang="en">EN</button>
        <button type="button" class="segmented__item" role="tab" data-lang="zh">中</button>
      </div>
      <a class="btn btn--accent btn--sm" id="header-book-btn" href="#" target="_blank" rel="noopener" data-i18n="book">예약</a>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <h1 class="hero__title" data-i18n="heroTitle">오조리 주인장의 제주 노트</h1>
      <p class="hero__lead" data-i18n="heroGreeting">
        책 읽기 좋은 민박, 오조록에서 손님을 위해 직접 고른 맛집 목록입니다.
        주인장 취향이 반영되었으니 참고하세요! 내돈내산! 광고아님!
      </p>
      <div class="hero__actions">
        <button type="button" class="btn btn--outline" id="share-btn" data-i18n="share">공유하기</button>
        <a class="btn btn--accent" id="hero-book-btn" href="#" target="_blank" rel="noopener" data-i18n="book">예약하기</a>
      </div>
    </div>
  </section>

  <div class="container">

    <section class="map-section">
      <div class="disclosure" id="map-disclosure">
        <button type="button" class="disclosure__trigger" id="map-toggle" aria-expanded="true" aria-controls="map">
          <span data-i18n="mapTitle">지도로 보기</span>
          <span class="disclosure__icon" aria-hidden="true">▾</span>
        </button>
        <div class="disclosure__panel">
          <div id="map" class="map"></div>
        </div>
      </div>
    </section>

    <section class="filter-bar">
      <div class="chip-group" id="filter-tabs" role="tablist" aria-label="Tag"></div>
      <label class="switch">
        <input type="checkbox" class="switch__input" id="sort-distance" />
        <span class="switch__label" data-i18n="sortNear">오조록에서 가까운 순</span>
      </label>
    </section>

    <main class="place-list" id="card-list"></main>

  </div>

  <footer class="app-footer">
    <div class="container">
      <p class="app-footer__brand" data-i18n="footerBrand">오조록 · 제주 성산 오조리의 숙소</p>
      <p class="app-footer__address" data-i18n="footerAddress">제주특별자치도 서귀포시 성산읍 오조로100번길 5</p>
      <div class="app-footer__links">
        <a class="btn btn--accent" id="footer-airbnb" href="#" target="_blank" rel="noopener" data-i18n="bookAirbnb">에어비앤비 예약</a>
        <a class="btn btn--accent" id="footer-naver" href="#" target="_blank" rel="noopener" data-i18n="bookNaver">네이버 예약</a>
        <!-- 예약이 아니라 구경하는 링크라 색을 낮춰 구분합니다.
             config/site.mjs 의 social.instagram 이 비어 있으면 app.js 가 이 버튼을 감춥니다. -->
        <a class="btn btn--outline" id="footer-instagram" href="#" target="_blank" rel="noopener" data-i18n="instagram">인스타그램</a>
      </div>
      <p class="app-footer__share-ask" data-i18n="footerShareAsk">이 리스트가 도움이 됐다면 친구에게 공유해주세요 🍊</p>
    </div>
  </footer>

  <!-- 지도 프로그램은 config/site.mjs 의 map.provider 에 따라 하나만 받아옵니다.
       둘 다 받으면 안 쓰는 쪽까지 손님 데이터를 잡아먹습니다.
       app.js 는 지도가 준비된 뒤에 시작해야 하므로 여기서 순서를 잡습니다. -->
  <script type="module">
    import { SITE } from "./config/site.mjs";

    const src = SITE.map.provider === "naver"
      ? `https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=${SITE.map.naverKeyId}`
      : "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";

    if (SITE.map.provider === "naver") {
      // 네이버 지도를 쓰면 Leaflet 의 CSS 는 필요 없습니다
      document.getElementById("leaflet-css")?.remove();
    }

    const script = document.createElement("script");
    script.src = src;
    // 지도를 못 받아와도 맛집 목록은 보여야 하므로, 실패해도 app.js 는 띄웁니다
    script.onload = script.onerror = () => import("./app.js");
    document.head.append(script);
  </script>
</body>
</html>
