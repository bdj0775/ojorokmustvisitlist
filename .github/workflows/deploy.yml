name: 검사 & 배포

# 올릴 때마다 데이터와 디자인 토큰을 검사합니다.
#
# 배포는 GitHub Pages 설정에서 "Deploy from a branch" 로 처리합니다.
# (이 저장소는 조립 과정이 없는 정적 파일 묶음이라 그 방식이 더 단순하고 안정적입니다.
#  Actions 배포 방식은 2026-08-06 에 GitHub 쪽 대기열이 막혀 10분 제한에 계속 걸렸습니다.
#  10분은 GitHub 이 강제하는 최대치라 늘릴 수 없습니다.)
#
# 아래 deploy 작업은 Actions 배포 방식으로 되돌릴 때를 대비해 남겨둔 것이며,
# Actions 탭에서 직접 실행할 때만 동작합니다.

on:
  push: # 어느 브랜치든 올리면 검사는 항상 실행
  pull_request:
  workflow_dispatch: # Actions 탭에서 "Run workflow" 로 직접 배포할 때

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: 데이터 · 디자인 토큰 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: places.json 검사
        run: node tools/validate-places.mjs
      - name: 색 대비 검사
        run: node tools/check-contrast.mjs

  deploy:
    name: GitHub Pages 배포
    needs: validate
    # 수동 실행할 때만 동작합니다. Pages 설정이 "GitHub Actions" 일 때만 의미가 있습니다.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: . # 빌드 과정이 없는 정적 사이트라 폴더를 그대로 올린다
      - id: deployment
        uses: actions/deploy-pages@v4
